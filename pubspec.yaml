  cloud_firestore: ^4.15.8
  
  google_sign_in: ^6.2.1

  # Adicione Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Adicione as que já tinha
  uuid: ^4.3.3
  intl: ^0.20.2
  rxdart: ^0.28.0
